// BookSim 2.0: Boardfly 4×8×36 (anynet).
// Топология — anynet, network_file подставляет скрипт.

topology = anynet;
routing_function = min;
traffic = uniform;
use_read_write = 0;
sim_type = latency;

warmup_periods = 1;
sample_period = 400;
max_samples = 3;
sim_count = 1;
seed = 1;

num_vcs = 16;
vc_buf_size = 8;
wait_for_tail_credit = 0;

vc_allocator = islip;
sw_allocator = islip;
alloc_iters = 2;

credit_delay = 1;
routing_delay = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;

input_speedup = 1;
output_speedup = 1;
internal_speedup = 1.0;

packet_size = 1;
priority = none;

print_csv_results = 1;
deadlock_warn_timeout = 4096;
latency_thres = 2000.0;
include_queuing = 1;
pair_stats = 0;
