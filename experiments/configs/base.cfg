// Базовая конфигурация BookSim 2.0 для внутрикластерных сетей.
// Топология задаётся файлом anynet (network_file подставляется скриптом).

topology = anynet;
routing_function = min;
traffic = uniform;
use_read_write = 0;
sim_type = latency;

warmup_periods = 2;
sample_period = 1000;
max_samples = 5;
sim_count = 1;
seed = 1;

num_vcs = 8;
vc_buf_size = 8;
wait_for_tail_credit = 0;

vc_allocator = islip;
sw_allocator = islip;
alloc_iters = 2;

credit_delay = 1;
routing_delay = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;

input_speedup = 1;
output_speedup = 1;
internal_speedup = 1.0;

packet_size = 1;
priority = none;

print_csv_results = 1;
deadlock_warn_timeout = 1024;
latency_thres = 500.0;
include_queuing = 1;
